name: 3D dobozlapok

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Minden doboz újragenerálása"
        type: boolean
        default: false
      debug:
        description: "Hibakereső képek a box-debug ágra"
        type: boolean
        default: false
  workflow_run:
    workflows: ["BrickLink készlet szinkron"]
    types: [completed]

concurrency:
  group: inventory-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  faces:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Van új szett doboz nélkül?
        id: need
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          inv = json.load(open("data/inventory.json"))
          p = "assets/boxes/index.json"
          idx = json.load(open(p)) if os.path.exists(p) else {}
          missing = [i["no"] for i in inv["items"] if i["type"] == "SET" and i["no"] not in idx]
          fp = "assets/figs/index.json"
          fidx = json.load(open(fp)) if os.path.exists(fp) else {}
          missing += [i["no"] for i in inv["items"] if i["type"] == "MINIFIG" and i["no"] not in fidx]
          print("run=" + ("true" if missing or "${{ inputs.force }}" == "true" else "false"))
          PY
      - uses: actions/setup-python@v5
        if: steps.need.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Dobozlapok készítése
        if: steps.need.outputs.run == 'true'
        run: |
          pip install --quiet opencv-python-headless numpy
          python scripts/box_faces.py ${{ inputs.force && '--force' || '' }} ${{ inputs.debug && '--debug' || '' }}
          python scripts/fig_cutouts.py ${{ inputs.force && '--force' || '' }} ${{ inputs.debug && '--debug' || '' }}
      - name: Hibakereső képek
        if: inputs.debug
        run: |
          git config user.name "inventory-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/_debug && mv assets/boxes/_debug/* /tmp/_debug/ 2>/dev/null || true
          mkdir -p /tmp/_debug/figs && mv assets/figs/_raw/* /tmp/_debug/figs/ 2>/dev/null || true
          git stash -u -q || true
          git checkout --orphan box-debug
          git rm -rfq . && rm -rf ./*
          cp -r /tmp/_debug/. .
          git add -A && git commit -qm debug && git push -f origin box-debug
          git checkout -q main && git stash pop -q || true
      - name: Mentés
        if: steps.need.outputs.run == 'true' && !inputs.debug
        run: |
          git config user.name "inventory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/boxes assets/figs
          git diff --cached --quiet || git commit -m "3D dobozlapok frissítése"
          git push
