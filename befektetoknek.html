<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Befektetőknek – Matthew's Fig Supply Co.</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202610190851">
<style>
  [hidden]{display:none!important}
  body{min-height:100vh;display:flex;flex-direction:column}
  main{flex:1}
  .num{font-variant-numeric:tabular-nums}

  /* login */
  .lock{display:grid;place-items:center;padding:72px 16px}
  .lock__card{width:100%;max-width:420px;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:36px 32px;text-align:center}
  .lock__card img{margin:0 auto 18px;border-radius:50%}
  .lock__card h1{font-size:34px;color:var(--green)}
  .lock__card p{color:var(--muted);margin:10px 0 24px}
  .pw{display:flex;border:1.5px solid var(--line);border-radius:12px;background:var(--cream);overflow:hidden}
  .pw:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,205,3,.35)}
  .pw input{flex:1;min-width:0;border:0;background:transparent;font:17px var(--body);padding:13px 14px;color:var(--ink)}
  .pw input:focus{outline:none}
  .pw button{border:0;background:transparent;font:600 13px var(--body);color:var(--muted);padding:0 14px;cursor:pointer}
  .lock .btn{width:100%;margin-top:14px}
  .lock .btn[disabled]{opacity:.6;cursor:wait}
  .err{color:#a3261b;font-size:14px;min-height:20px;margin:12px 0 0!important}

  /* dashboard */
  .dash-hero{background:var(--green);color:var(--cream);padding:44px 0 36px}
  .dash-hero__in{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .dash-hero h1{font-size:clamp(34px,5vw,52px);font-weight:800}
  .dash-hero p{margin:8px 0 0;opacity:.85}
  .logout{background:transparent;border:1.5px solid rgba(247,243,227,.5);color:var(--cream);font:600 14px var(--body);padding:8px 16px;border-radius:999px;cursor:pointer}
  .logout:hover{border-color:var(--gold);color:var(--gold)}
  .kpis-band{background:var(--gold)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-block:22px}
  .kpis > div{min-width:0}
  .kpis b{display:block;font-family:var(--display);font-size:clamp(22px,2.6vw,30px);color:var(--green)}
  .kpis span{font-size:13px;font-weight:600;color:var(--green)}
  .deals{padding:44px 0 72px;display:grid;gap:18px}
  .deals h2{margin-top:18px}
  .deal-tools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:-6px}
  .deal-tools button{background:transparent;border:0;font:600 14px var(--body);color:var(--green);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .deals h2{font-size:28px}
  .deal{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
  .deal__head{display:flex;gap:16px;align-items:center;padding:18px 22px;cursor:pointer;list-style:none}
  .deal__head::-webkit-details-marker{display:none}
  .deal[open] > .deal__head{border-bottom:1.5px solid var(--line)}
  .deal__head:hover{background:#fffdf4}
  .deal__head:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
  .thumbs{display:flex;flex-wrap:wrap;gap:4px;max-width:430px;flex:0 1 auto}
  .thumbs img{width:56px;height:44px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px}
  .deal__peek{display:grid;justify-items:end;text-align:right;line-height:1.2}
  .deal__peek span{font-size:13px;color:var(--muted)}
  .deal__peek b{font-family:var(--display);font-size:20px;color:#1d6b35}
  .deal__peek small{font-size:11px;color:var(--muted);font-weight:600}
  .chev{width:12px;height:12px;border-right:2.5px solid var(--green);border-bottom:2.5px solid var(--green);transform:rotate(45deg);margin:0 4px 6px 4px;transition:transform .2s;flex:none}
  .deal[open] .chev{transform:rotate(-135deg);margin-bottom:-4px}
  @media (prefers-reduced-motion: reduce){ .chev{transition:none} }
  @media (max-width:560px){ .thumbs{max-width:100%;order:5;flex-basis:100%} .thumbs img{width:44px;height:36px} .deal__head{flex-wrap:wrap;gap:10px} .deal__title{flex-basis:calc(100% - 90px)} .deal__peek{justify-items:start;text-align:left;margin-right:auto} }
  .deal__head img{width:72px;height:56px;object-fit:contain;flex:none}
  .deal__title{flex:1;min-width:0}
  .deal__title small{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
  .deal__title b{font-size:19px}
  .pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
  .pill--open{background:var(--gold);color:var(--green)}
  .pill--closed{background:#e4efe6;color:var(--green)}
  .deal__body{padding:20px 22px;display:grid;gap:20px}
  .deal__body > *{min-width:0}
  .deals > *{min-width:0}
  .progress{display:grid;gap:6px}
  .progress__bar{height:10px;border-radius:999px;background:var(--cream);border:1px solid var(--line);overflow:hidden}
  .progress__bar i{display:block;height:100%;background:var(--green);border-radius:999px}
  .progress__label{font-size:14px;color:var(--muted)}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:8px 10px;border-bottom:1.5px solid var(--line)}
  td{text-align:right;padding:10px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  tfoot td{font-weight:700;border-bottom:0}
  tfoot tr.extra td{font-weight:400;color:var(--muted);border-bottom:1px solid var(--line)}
  .setcell{display:flex;align-items:center;gap:10px;min-width:220px}
  .setcell img{width:44px;height:34px;object-fit:contain;flex:none}
  .setcell small{display:block;font-size:11px;color:var(--muted);font-weight:700}
  .sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .sums div{background:var(--cream);border-radius:10px;padding:12px 14px}
  .sums span{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .sums b{font-family:var(--display);font-size:21px;color:var(--green)}
  .sums .is-profit b{color:#1d6b35}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .split > div{border:1.5px solid var(--line);border-radius:10px;padding:14px}
  .split h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .split p{margin:2px 0;display:flex;justify-content:space-between;gap:10px}
  .split p.me{font-weight:700;color:var(--green)}
  .empty-inv{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:40px 28px;text-align:center;display:grid;justify-items:center;gap:12px}
  .empty-inv p{max-width:52ch;color:var(--muted);margin:0}
  .dash-actions{display:flex;gap:8px;flex-wrap:wrap}
  .master{padding:40px 0 72px}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .mcard{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:6px}
  .mcard:hover,.mcard:focus-visible{border-color:var(--gold);box-shadow:0 8px 22px -14px rgba(18,50,27,.5)}
  .mcard b{font-family:var(--display);font-size:24px;color:var(--green)}
  .mcard > span{font-size:14px;color:var(--muted)}
  .mcard dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
  .mcard dt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .mcard dd{margin:0;font-weight:700;color:var(--green)}
  .mcard i{font-style:normal;font-weight:700;color:var(--green);border-bottom:2px solid var(--gold);justify-self:start}
  .mcard--err{cursor:default;border-color:#e2b4ae}
  .note{font-size:14px;color:var(--muted);background:var(--cream);border-radius:10px;padding:12px 14px;margin:0}
  @media (max-width:760px){ .kpis{grid-template-columns:repeat(2,1fr)} .split{grid-template-columns:1fr} }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top__in">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="" width="44" height="44">
      <span>Matthew's <em>Fig Supply Co.</em></span>
    </a>
    <nav class="nav">
      <a href="szettek.html" class="nav__main">Szettek</a>
      <a href="figurak.html" class="nav__main">Figurák</a>
    </nav>
    <a class="inv-btn is-current" href="befektetoknek.html" aria-current="page">Befektetőknek</a>
  </div>
</header>

<main>
  <section class="lock" id="lock">
    <form class="lock__card" id="lockForm" autocomplete="off">
      <img src="assets/logo.png" alt="" width="84" height="84">
      <h1>Befektetőknek</h1>
      <p>Írd be a személyes jelszavadat, és megnyílik a közös ügyleteid áttekintése.</p>
      <div class="pw">
        <input id="pw" type="password" placeholder="Jelszó" aria-label="Jelszó" autocomplete="current-password" required>
        <button type="button" id="pwToggle" aria-label="Jelszó mutatása">Mutat</button>
      </div>
      <button class="btn btn--gold" id="go" type="submit">Belépés</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </section>

  <div id="dash" hidden>
    <section class="dash-hero">
      <div class="wrap dash-hero__in">
        <div>
          <p class="kicker">Befektetői áttekintés</p>
          <h1 id="hello">Szia!</h1>
          <p id="sub"></p>
        </div>
        <div class="dash-actions">
          <button class="logout" id="back" type="button" hidden>← Befektetők</button>
          <button class="logout" id="logout" type="button">Kilépés</button>
        </div>
      </div>
    </section>
    <section class="wrap master" id="master" hidden></section>
    <section class="kpis-band">
      <div class="kpis wrap" id="kpis"></div>
    </section>
    <section class="wrap deals" id="deals"></section>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot__in">
    <div><img src="assets/logo.png" alt="Matthew's Fig Supply Co." width="64" height="64"></div>
    <div>
      <h3>Kérdésed van?</h3>
      <p>Írj Máténak Messengeren: <a href="https://m.me/100091130775442" target="_blank" rel="noopener">m.me/100091130775442</a></p>
    </div>
  </div>
</footer>

<script>
(() => {
  const SALT = new TextEncoder().encode("matthewsfigs.hu/investors/v1");
  const ROUNDS = 600000;
  const $ = id => document.getElementById(id);
  const huf = v => new Intl.NumberFormat("hu-HU", { style: "currency", currency: "HUF", maximumFractionDigits: 0 }).format(Math.round(v));
  const pct = v => new Intl.NumberFormat("hu-HU", { style: "percent", maximumFractionDigits: 1 }).format(v);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function unlock(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password.trim()), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: SALT, iterations: ROUNDS, hash: "SHA-256" }, base, 384));
    const id = [...bits.slice(32)].map(b => b.toString(16).padStart(2, "0")).join("");
    const res = await fetch(`data/i/${id}.json`, { cache: "no-cache" });
    if (!res.ok) return null;
    const blob = await res.json();
    const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, key, b64(blob.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  // Rule: the investor gets SHARE (e.g. 70%) of the profit made on THEIR capital.
  // If Máté also put money in, the profit on Máté's part is entirely Máté's.
  let SHARE = 0.7;
  function calc(d) {
    const s = { qty: 0, sold: 0, cost: 0, revAll: 0, rev: 0, costSold: 0 };
    for (const l of d.lines) {
      s.qty += l.qty; s.sold += l.sold;
      s.cost += l.qty * l.buy; s.revAll += l.qty * l.sell;
      s.rev += l.sold * l.sell; s.costSold += l.sold * l.buy;
    }
    s.goods = s.cost;
    s.extra = (d.extras || []).reduce((a, x) => a + x.amount, 0);   // shipping, fees…
    s.cost += s.extra;
    // extra costs are charged to the sold pieces in proportion to their purchase value
    s.extraSold = s.goods ? s.extra * (s.costSold / s.goods) : 0;
    s.costSold += s.extraSold;
    s.profit = s.rev - s.costSold;          // realised, on the pieces sold
    s.profitAll = s.revAll - s.cost;        // if everything sells at the listed price
    // investor's part of the capital
    s.capKnown = !!(d.capital && d.capital.investor != null);
    if (s.capKnown) {
      s.capI = d.capital.investor;
      s.capM = d.capital.mate || 0;
      s.noCap = !s.capI && !s.capM;
      s.capShare = s.noCap ? 1 : d.capitalPct ? d.capitalPct.investor : s.capI / (s.capI + s.capM);
    }
    s.share = d.profitShare ? d.profitShare.investor : SHARE;
    if (s.capKnown) {
      s.myProfit = s.profit * s.capShare * s.share;
      s.myProfitAll = s.profitAll * s.capShare * s.share;
      s.mateProfit = s.profit - s.myProfit;
    }
    return s;
  }

  function render(data) {
    const me = data.investor;
    SHARE = data.share != null ? data.share : 0.7;
    $("hello").textContent = `Szia ${me}!`;
    $("sub").textContent = `Közös ügyleteink a Matthew's Fig Supply Co.-val` + (data.updated ? ` · frissítve: ${new Date(data.updated).toLocaleDateString("hu-HU", { dateStyle: "long" })}` : "");

    let capital = 0, myProfit = 0, open = 0, expected = 0, missing = false;
    for (const d of data.deals) {
      const s = calc(d);
      if (s.capKnown) { capital += s.capI; myProfit += s.myProfit; }
      if (d.status === "open") {
        open++;
        if (s.capKnown) expected += s.myProfitAll; else missing = true;
      }
    }
    $("kpis").innerHTML = `
      <div><b class="num">${huf(capital)}</b><span>befektetett tőkéd</span></div>
      <div><b class="num">${huf(myProfit)}</b><span>eddigi nyereséged${data.share != null ? ` (${pct(SHARE)})` : ""}</span></div>
      <div><b class="num">${data.deals.length}</b><span>közös ügylet (${open} folyamatban)</span></div>
      <div><b class="num">${huf(expected)}</b><span>várható nyereséged a futó ügyletekből${missing ? "*" : ""}</span></div>`;

    const groups = [["open", "Folyamatban lévő beszerzések"], ["closed", "Lezárt ügyletek"]];
    if (!data.deals.length) {
      $("kpis").parentElement.hidden = true;
      $("deals").innerHTML = `<div class="empty-inv"><h2>Még nincs közös ügyletünk</h2>
        <p>Amint elindul az első közös beszerzésünk, itt követheted nyomon: mit vettünk, mennyiért, mi kelt el, és mennyi a nyereséged.</p>
        <a class="btn btn--gold" href="https://m.me/100091130775442" target="_blank" rel="noopener">Írj Máténak Messengeren</a></div>`;
      return;
    }
    $("kpis").parentElement.hidden = false;
    $("deals").innerHTML = (data.share == null ? "" :
      `<p class="note"><b>Elszámolás:</b> a befektetett tőkéd után keletkező nyereség ${pct(SHARE)}-a a tiéd, ${pct(1 - SHARE)}-a Mátéé. Ha egy ügyletbe Máté is tett tőkét, az ő részének nyeresége teljes egészében őt illeti. Példa: 100 000 Ft tőke, 150 000 Ft eladás → 50 000 Ft nyereség, ebből ${huf(50000 * SHARE)} a tiéd, és visszakapod a 100 000 Ft tőkét is.</p>`) +
      `<div class="deal-tools"><button type="button" data-all="1">Mind kinyitása</button><button type="button" data-all="0">Mind becsukása</button></div>` +
      groups.map(([st, title]) => {
        const list = data.deals.filter(d => d.status === st);
        return list.length ? `<h2>${title}</h2>` + list.map(d => deal(d, me)).join("") : "";
      }).join("") +
      (missing ? `<p class="note">* Ahol a befektetett tőkéd még nincs rögzítve, az az ügylet nem szerepel a várható nyereségben.</p>` : "");
  }

  const pic = l => l.fig ? `https://img.bricklink.com/ItemImage/MN/0/${encodeURIComponent(l.set)}.png`
                          : `https://img.bricklink.com/ItemImage/SN/0/${encodeURIComponent(l.set)}-1.png`;
  function deal(d, me) {
    const s = calc(d);
    const open = d.status === "open";
    const multi = d.lines.some(l => l.set);
    const rows = d.lines.map(l => `<tr>
        ${multi ? `<td><div class="setcell"><img src="${pic(l)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span><small>${esc(l.set)}</small>${esc(l.name || "")}</span></div></td>` : ""}
        <td class="num">${l.qty} db</td><td class="num">${huf(l.buy)}</td><td class="num">${huf(l.sell)}</td>
        <td class="num">${l.sold} db</td><td class="num">${huf(l.sold * l.sell)}</td></tr>`).join("");
    const split = s.capKnown ? `
      <div class="split">
        <div><h4>Tőke</h4>
          ${s.noCap ? `<p class="me"><span>Befektetett tőke nélkül</span><span class="num">${huf(0)}</span></p><p><span>A nyereség ${pct(s.share)}-a a tiéd</span></p>` : `<p class="me"><span>${esc(me)}</span><span class="num">${huf(s.capI)} · ${pct(s.capShare)}</span></p>`}
          ${s.capM && !s.noCap ? `<p><span>Máté</span><span class="num">${huf(s.capM)} · ${pct(1 - s.capShare)}</span></p>` : ""}</div>
        <div><h4>Nyereség${open ? " (eddig)" : ""}</h4>
          <p class="me"><span>${esc(me)} · ${pct(s.share)}${s.noCap ? "" : " a saját tőkéje után"}</span><span class="num">${huf(s.myProfit)}</span></p>
          ${s.mateProfit > 0.5 ? `<p><span>Máté</span><span class="num">${huf(s.mateProfit)}</span></p>` : ""}
          ${open ? `<p><span>Várható nyereséged, amikor minden elkel</span><span class="num">${huf(s.myProfitAll)}</span></p>`
                 : `<p class="me"><span>Neked jár összesen (tőke + nyereség)</span><span class="num">${huf(s.capI + s.myProfit)}</span></p>`}
        </div>
      </div>` : `<p class="note">A befektetett tőkéd ennél az ügyletnél még nincs rögzítve, ezért a te részedet még nem tudjuk kiszámolni.</p>`;
    return `<details class="deal">
      <summary class="deal__head">
        ${d.set ? `<img src="https://img.bricklink.com/ItemImage/SN/0/${encodeURIComponent(d.set)}-1.png" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
          : `<div class="thumbs">${d.lines.filter(l => l.set).map(l => `<img src="${pic(l)}" alt="${esc(l.name || l.set)}" title="${esc(l.name || l.set)}" loading="lazy" onerror="this.style.display='none'">`).join("")}</div>`}
        <div class="deal__title"><small>${esc(d.set || `${d.lines.length} féle ${d.lines.every(l => l.fig) ? "figura" : "szett"}`)}</small><b>${esc(d.name)}</b></div>
        <div class="deal__peek">
          <span class="num">${s.sold}/${s.qty} db eladva</span>
          ${s.capKnown ? `<b class="num">${huf(s.myProfit)}</b><small>nyereséged${open ? " eddig" : ""}</small>` : ""}
        </div>
        <span class="pill ${open ? "pill--open" : "pill--closed"}">${open ? "Folyamatban" : "Lezárva"}</span>
        <span class="chev" aria-hidden="true"></span>
      </summary>
      <div class="deal__body">
        <div class="progress">
          <div class="progress__bar"><i style="width:${s.qty ? (s.sold / s.qty) * 100 : 0}%"></i></div>
          <span class="progress__label num">${s.sold} / ${s.qty} db eladva</span>
        </div>
        <div class="tbl"><table>
          <thead><tr>${multi ? "<th>Szett</th>" : ""}<th>Mennyiség</th><th>Vételi ár</th><th>Eladási ár</th><th>Eladva</th><th>Bevétel</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot>${(d.extras || []).map(x => `<tr class="extra">${multi ? "<td></td>" : ""}<td>${esc(x.label)}</td><td class="num">${huf(x.amount)}</td><td></td><td></td><td></td></tr>`).join("")}
            <tr>${multi ? "<td>Összesen</td>" : ""}<td class="num">${s.qty} db</td><td class="num">${huf(s.cost)}</td><td></td><td class="num">${s.sold} db</td><td class="num">${huf(s.rev)}</td></tr></tfoot>
        </table></div>
        <div class="sums">
          <div><span>Beszerzés összesen</span><b class="num">${huf(s.cost)}</b></div>
          <div><span>Bevétel eddig</span><b class="num">${huf(s.rev)}</b></div>
          <div class="is-profit"><span>Ügylet nyeresége${open ? " eddig" : ""}</span><b class="num">${huf(s.profit)}</b></div>
          ${open ? `<div><span>Ügylet várható nyeresége</span><b class="num">${huf(s.profitAll)}</b></div>` : ""}
        </div>
        ${split}
      </div>
    </details>`;
  }

  $("pwToggle").onclick = () => {
    const shown = $("pw").type === "text";
    $("pw").type = shown ? "password" : "text";
    $("pwToggle").textContent = shown ? "Mutat" : "Elrejt";
  };
  $("lockForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) { $("err").textContent = "Ez az oldal csak biztonságos (https://) kapcsolaton nyitható meg."; return; }
    $("go").disabled = true; $("go").textContent = "Ellenőrzés…"; $("err").textContent = "";
    try {
      const data = await unlock($("pw").value);
      if (!data) { $("err").textContent = "Ehhez a jelszóhoz nem tartozik befektetői oldal. Figyelj a kis- és nagybetűkre."; return; }
      data.master ? await renderMaster(data) : render(data);
      $("pw").value = "";
      $("lock").hidden = true; $("dash").hidden = false; window.scrollTo(0, 0);
    } catch (err) {
      $("err").textContent = "Nem sikerült megnyitni az oldalt. Próbáld újra pár perc múlva.";
    } finally {
      $("go").disabled = false; $("go").textContent = "Belépés";
    }
  });
  $("logout").onclick = () => {
    $("deals").innerHTML = $("kpis").innerHTML = $("master").innerHTML = "";
    MASTER = null; $("back").hidden = true; $("master").hidden = true;
    $("dash").hidden = true; $("lock").hidden = false; $("pw").focus();
  };
  $("back").onclick = () => showMasterList();
  $("deals").addEventListener("click", e => {
    const b = e.target.closest("[data-all]");
    if (b) $("deals").querySelectorAll("details.deal").forEach(d => d.open = b.dataset.all === "1");
  });

  // ---------- master view: pick an investor ----------
  let MASTER = null;   // [{name, data}]
  async function renderMaster(m) {
    const loaded = await Promise.all(m.investors.map(async i => ({ name: i.name, data: await unlock(i.password).catch(() => null) })));
    MASTER = loaded;
    showMasterList();
  }
  function showMasterList() {
    $("hello").textContent = "Befektetők";
    $("sub").textContent = "Válaszd ki, kinek az oldalát szeretnéd megnézni.";
    $("back").hidden = true;
    $("kpis").parentElement.hidden = true; $("deals").hidden = true; $("deals").innerHTML = "";
    $("master").hidden = false;
    $("master").innerHTML = `<div class="mgrid">` + MASTER.map((x, n) => {
      if (!x.data) return `<div class="mcard mcard--err"><b>${esc(x.name)}</b><span>Az oldal nem nyitható meg (hibás jelszó a listában).</span></div>`;
      let cap = 0, prof = 0, open = 0;
      for (const d of x.data.deals) { const s = calc(d); if (s.capKnown) { cap += s.capI; prof += s.myProfit; } if (d.status === "open") open++; }
      return `<button class="mcard" type="button" data-n="${n}">
        <b>${esc(x.name)}</b>
        <span>${x.data.deals.length ? `${x.data.deals.length} ügylet · ${open} folyamatban` : "Még nincs ügylet"}</span>
        <dl><div><dt>Tőke</dt><dd class="num">${huf(cap)}</dd></div><div><dt>Nyeresége eddig</dt><dd class="num">${huf(prof)}</dd></div></dl>
        <i>Megnyitás →</i></button>`;
    }).join("") + `</div>`;
    $("master").querySelectorAll(".mcard[data-n]").forEach(b => b.onclick = () => {
      $("master").hidden = true; $("deals").hidden = false; $("back").hidden = false;
      render(MASTER[+b.dataset.n].data); window.scrollTo(0, 0);
    });
  }
})();
</script>
</body>
</html>
