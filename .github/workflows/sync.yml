name: BrickLink készlet szinkron

concurrency:
  group: inventory-sync
  cancel-in-progress: false

on:
  schedule:
    - cron: "7,37 * * * *"   # félóránként
  workflow_dispatch: {}       # kézi indítás az Actions fülön

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Készlet letöltése
        env:
          BL_CONSUMER_KEY: ${{ secrets.BL_CONSUMER_KEY }}
          BL_CONSUMER_SECRET: ${{ secrets.BL_CONSUMER_SECRET }}
          BL_TOKEN: ${{ secrets.BL_TOKEN }}
          BL_TOKEN_SECRET: ${{ secrets.BL_TOKEN_SECRET }}
          STORE_CURRENCY: ${{ vars.STORE_CURRENCY || 'EUR' }}
        run: python scripts/sync_bricklink.py
      - name: Katalógusadatok (év, téma, elemszám, minifigurák)
        continue-on-error: true
        env:
          BL_CONSUMER_KEY: ${{ secrets.BL_CONSUMER_KEY }}
          BL_CONSUMER_SECRET: ${{ secrets.BL_CONSUMER_SECRET }}
          BL_TOKEN: ${{ secrets.BL_TOKEN }}
          BL_TOKEN_SECRET: ${{ secrets.BL_TOKEN_SECRET }}
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
        run: python scripts/catalog_details.py
      - name: Változás mentése
        run: |
          git config user.name "inventory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/inventory.json data/prices_huf.json data/details.json 2>/dev/null || git add data/inventory.json data/prices_huf.json
          git diff --cached --quiet || git commit -m "Készlet frissítése $(date -u +%F' '%H:%M)"
          git push
